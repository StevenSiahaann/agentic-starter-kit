name: Production Quality & Security CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================================
  # 1. HARNESS & ARCHITECTURAL VERIFICATION (Always Runs)
  # ============================================================================
  harness-verification:
    name: Agent & Architectural Verification Harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Deterministic Verification Harness
        run: |
          chmod +x .agents/hooks/scripts/*.sh
          ./.agents/hooks/scripts/harness-verify.sh

  # ============================================================================
  # 2. STATIC ANALYSIS & LINTING (Runs when package.json exists)
  # ============================================================================
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != ''
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm run lint

      - name: Run Strict TypeCheck
        run: pnpm exec tsc --noEmit

  # ============================================================================
  # 3. SECURITY SAST & SECRET SCAN
  # ============================================================================
  security-audit:
    name: Security & Secret Scan (OWASP)
    runs-on: ubuntu-latest
    needs: [harness-verification]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Detection (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Vulnerability Scanner (Trivy FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  # ============================================================================
  # 4. AUTOMATED TESTS (UNIT & INTEGRATION - Runs when package.json exists)
  # ============================================================================
  test-suite:
    name: Automated Tests (AAA Pattern)
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != ''
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests with Coverage Threshold
        run: pnpm run test:coverage

  # ============================================================================
  # 5. CONTAINER BUILD & RUNTIME SECURITY SCAN (Runs when Dockerfile exists)
  # ============================================================================
  container-build:
    name: Multi-Stage Distroless Build
    runs-on: ubuntu-latest
    needs: [security-audit]
    if: github.ref == 'refs/heads/main' && hashFiles('Dockerfile') != ''
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: app/service:${{ github.sha }}
          load: true

      - name: Scan Built Image (Trivy Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app/service:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
